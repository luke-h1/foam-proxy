name: Deploy production
on:
  workflow_dispatch:
    inputs:
      reviewer_account_refresh_enabled:
        description: "Enable the App Review magic link + token keepalive (defaults on; set false to disable the live route)"
        type: boolean
        default: true
  push:
    branches:
      - main
concurrency:
  group: build-production-version
  cancel-in-progress: false
permissions:
  issues: write
  contents: write
  pull-requests: write

env:
  TF_VAR_env: production
  # Magic link stays enabled across automatic main deploys. push events carry no
  # inputs, so the old `inputs.* || false` reset the flag to false on every merge,
  # tore down the SSM blob, and 404d /api/magic. Pushes default ON; a manual
  # workflow_dispatch still honors the toggle (set it false to disable the route).
  TF_VAR_reviewer_account_refresh_enabled: ${{ inputs.reviewer_account_refresh_enabled || github.event_name != 'workflow_dispatch' }}
  TF_VAR_api_key: ${{ secrets.STAGING_API_KEY }}
  TF_VAR_zone_id: ${{ secrets.ZONE_ID }}
  TF_VAR_root_domain: foam-app.com
  TF_VAR_private_key: ${{ secrets.PRODUCTION_PRIVATE_KEY }}
  TF_VAR_certificate_body: ${{ secrets.PRODUCTION_CERTIFICATE_BODY }}
  TF_VAR_certificate_chain: ${{ secrets.CERTIFICATE_CHAIN }}
  TF_VAR_deployed_by: ${{ github.actor }}
  TF_VAR_git_sha: ${{ github.sha }}
  TF_VAR_magic_link_blob: ${{ secrets.MAGIC_LINK_BLOB_PRODUCTION }}

jobs:
  release:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Load secrets
        id: load_secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TWITCH_CLIENT_ID: op://ci-cd/foam-proxy-production/TWITCH_CLIENT_ID
          TWITCH_CLIENT_SECRET: op://ci-cd/foam-proxy-production/TWITCH_CLIENT_SECRET
          TF_VAR_magic_link_api_key: op://ci-cd/foam-proxy-production/MAGIC_LINK_API_KEY
          TF_VAR_discord_webhook_url: op://ci-cd/foam-proxy-production/DISCORD_WEBHOOK_URL
          TF_VAR_telegram_bot_token: op://ci-cd/foam-proxy-production/TELEGRAM_BOT_TOKEN
          TF_VAR_telegram_chat_id: op://ci-cd/foam-proxy-production/TELEGRAM_CHAT_ID
          PROXY_DSN: op://ci-cd/foam-proxy-production/SENTRY_PROXY_DSN
          AUTHORIZER_DSN: op://ci-cd/foam-proxy-production/SENTRY_AUTH_DSN
          OP_ENV_FILE: ".env"

      - name: Set Terraform variables
        run: |
          echo "TF_VAR_twitch_client_id=$TWITCH_CLIENT_ID" >> $GITHUB_ENV
          echo "TF_VAR_twitch_client_secret=$TWITCH_CLIENT_SECRET" >> $GITHUB_ENV
          echo "TF_VAR_proxy_dsn=$PROXY_DSN" >> $GITHUB_ENV
          echo "TF_VAR_authorizer_dsn=$AUTHORIZER_DSN" >> $GITHUB_ENV

      - name: Install
        uses: ./.github/actions/install

      - name: Validate
        uses: ./.github/actions/validate

      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          environment: production
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cut-release:
    name: Cut release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish a release the last run did not finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_LINE="$(git tag -l | { grep -E '^v*[0-9]+\.[0-9]+\.[0-9]+$' || true; } | awk '{ v=$0; sub(/^v*/, "", v); print v "\t" $0 }' | sort -V | tail -1)"
          if [ -z "$LATEST_LINE" ]; then
            exit 0
          fi
          LATEST_VERSION="$(printf '%s' "$LATEST_LINE" | cut -f1)"
          LATEST_TAG="$(printf '%s' "$LATEST_LINE" | cut -f2)"
          if git tag -l "$LATEST_VERSION" | grep -qx "$LATEST_VERSION"; then
            LATEST_TAG="$LATEST_VERSION"
          fi
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          if ! bun scripts/release-notes.ts show --version "$LATEST_VERSION" > "$RUNNER_TEMP/latest-notes.md"; then
            echo "CHANGELOG.md has no section for ${LATEST_VERSION}; nothing to publish"
            exit 0
          fi
          echo "Publishing the release for ${LATEST_TAG} that an earlier run tagged but did not create"
          gh release create "$LATEST_TAG" --title "$LATEST_VERSION" --notes-file "$RUNNER_TEMP/latest-notes.md"

      - name: Resolve the next version
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(git tag -l | sed 's/^v*//' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
          CURRENT="${CURRENT:-0.0.0}"
          NEXT="$(bun scripts/release-notes.ts next-version --current "$CURRENT")"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          if [ -z "$NEXT" ]; then
            echo "No changeset asks for a release; ${CURRENT} stays the latest version"
          else
            echo "Release version: ${NEXT}"
          fi

      - name: Cut CHANGELOG.md, tag and release
        if: steps.version.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          bun scripts/release-notes.ts release --version "$NEXT" > "$RUNNER_TEMP/release-notes.md"
          git config user.name "luke-h1"
          git config user.email "55030296+luke-h1@users.noreply.github.com"
          git add CHANGELOG.md .changeset
          git commit -m "chore(changelog): release ${NEXT} [skip ci]"
          git tag -a "$NEXT" -m "Release ${NEXT}"
          git push --atomic origin main "$NEXT"
          gh release create "$NEXT" --title "$NEXT" --notes-file "$RUNNER_TEMP/release-notes.md"
