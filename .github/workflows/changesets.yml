name: Changesets

on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset-status:
    name: Changeset present
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the release notes script
        run: bun test scripts

      - name: Check the pull request has a changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: bun run changeset -- status --since="origin/${BASE_REF}"

      - name: Check every note has a package, a bump and text
        run: bun scripts/release-notes.ts pending
